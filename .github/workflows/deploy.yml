name: Deploy Flask App

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu

            # Clone if not exists, otherwise pull latest changes
            if [ ! -d "CICDFlaskApp" ]; then
              git clone https://github.com/Sandeeprajakgithub/CICDFlaskApp.git
            else
              cd CICDFlaskApp && git pull origin master
              cd /home/ubuntu
            fi

            cd CICDFlaskApp

            # Activate venv and install dependencies
            source venv/bin/activate

            # Kill old instance and restart in background
            pkill -f app.py || true
            nohup python3 app.py > app.log 2>&1 &

            echo "Deployment completed"