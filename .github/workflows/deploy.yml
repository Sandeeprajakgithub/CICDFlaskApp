name: Deploy Flask App

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          script: |
          cd /home/ubuntu/CICDFlaskApp
          git fetch origin
          git reset --hard origin/master
          pkill -f app.py || true
          sleep 2
          setsid /home/ubuntu/CICDFlaskApp/venv/bin/python app.py > app.log 2>&1 &
          echo "Deployment completed"